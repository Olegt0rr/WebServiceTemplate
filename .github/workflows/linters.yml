name: Linters

on: [ push, pull_request ]

jobs:

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"
          args: "format --check"

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jpetrucciani/mypy-check@master
        with:
          path: './app'
          mypy_flags: '--config-file pyproject.toml'
